name: 'Close stale PRs'
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          stale-pr-message: 'This PR is stale because it has had no activity for 10 days. Remove the stale label or add a comment to keep it open; otherwise it may be closed after 5 more days without activity.'
          close-pr-message: 'This PR was closed because it remained stale for 5 days without activity.'
          days-before-issue-stale: -1
          days-before-issue-close: -1
          days-before-pr-stale: 10
          days-before-pr-close: 5
